[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsorp"
version = "0.1.0"
description = "Adsorption isotherm / kinetics / pH-edge analysis pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.scripts]
adsorp = "adsorp.cli:main"

[tool.setuptools]
packages = ["adsorp"]
